[package]
name = "devskill"
version = "0.1.0"
edition = "2024"
description = "Install AI skills and agents into projects"
license = "MIT"

[[bin]]
name = "devskill"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
